name: Bug report
description: ScriptPort reported something wrong, missed a problem or crashed
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest file (or snippet) that reproduces the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: scriptport --version, Node.js version, Windows / macOS / Linux
    validations:
      required: true
